services:
  # ============================================================================
  # ADMIN DASHBOARD
  # ============================================================================
  admin-dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: dockerfile
    container_name: vayureader_admin
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FILE_URL_SECRET: ${FILE_URL_SECRET}
    networks:
      - backend-network

  # ============================================================================
  # APP SERVICE (Node.js Backend)
  # ============================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: vayureader_api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_healthy        # ← added
    env_file:
      - .env
    networks:
      - backend-network
    volumes:
      - ./uploads:/usr/src/app/uploads
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3000/health" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ============================================================================
  # NGINX (Reverse Proxy & Gateway)
  # ============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: vayureader_gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      FILE_URL_SECRET: ${FILE_URL_SECRET}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./uploads:/usr/src/app/uploads:ro
    depends_on:
      app:
        condition: service_healthy
      admin-dashboard:
        condition: service_started
      minio:
        condition: service_healthy        # ← added
    networks:
      - backend-network
      - storage-network                   # ← added

  # ============================================================================
  # POSTGRESQL (General Data)
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: vayureader_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: vayureader
      POSTGRES_USER: vayureader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vayureader}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./src/db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    networks:
      - backend-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U vayureader -d vayureader" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # CLICKHOUSE (Log Analytics)
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: vayureader_logs
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: vayureader_logs
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - backend-network
    healthcheck:
      test: [ "CMD-SHELL", "clickhouse-client --query 'SELECT 1'" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ============================================================================
  # REDIS
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: vayureader_cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru  # ← added
    networks:
      - backend-network

  # ============================================================================
  # ELASTICSEARCH (Search Engine)
  # ============================================================================
  elasticsearch:
    image: elasticsearch:8.11.0
    container_name: vayureader_search
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - backend-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ============================================================================
  # MINIO (Object Storage)
  # ============================================================================
  minio:
    image: minio/minio:latest
    container_name: vayureader_storage
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
      MINIO_STORAGE_CLASS_STANDARD: EC:0          
      MINIO_API_REQUESTS_MAX: 600                 
      MINIO_API_REQUESTS_DEADLINE: 10s            
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API (kept exposed for dev)
      - "9001:9001"   # Web console
    networks:
      - backend-network
      - storage-network                           
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

# ==============================================================================
# NETWORKS & VOLUMES
# ==============================================================================
networks:
  backend-network:
    driver: bridge
  storage-network:                               
    driver: bridge
    driver_opts:
      com.docker.network.driver.mtu: "9000"

volumes:
  postgres-data:
  clickhouse-data:
  clickhouse-logs:
  es-data:
  minio-data: